app:
  name: "Avenox Audio Studio"
  version: "1.0.0"
  author: "SayMaven"

audio:
  target_sample_rate: 44100
  internal_dtype: "float32"
  declip_margin_db: -0.5
  default_export_format: "wav"
  default_bit_depth: "PCM_24"
  supported_extensions:
    - ".wav"
    - ".flac"
    - ".mp3"
    - ".m4a"
    - ".ogg"
    - ".aac"
    - ".alac"

paths:
  models_dir: "models"
  default_models_dir: "models/default"
  custom_models_dir: "models/custom"
  output_dir: "output"
  dataset_dir: "dataset"
  temp_dir: "temp"

hardware:
  preferred_device: "cuda"
  fallback_device: "cpu"
  enable_fp16: true
  enable_cudnn_benchmark: true
  default_vram_profile: "low_4gb"
